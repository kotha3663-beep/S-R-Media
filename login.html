<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>লগইন - NnowQuiz</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo">NnowQuiz</div>
      <p class="auth-subtitle">মজার কুইজ খেলে জ্ঞান বাড়াও</p>

      <form id="loginForm">
        <div class="form-group">
          <label>ইমেইল</label>
          <input type="email" id="email" class="form-control" placeholder="আপনার ইমেইল লিখুন" required>
        </div>

        <div class="form-group">
          <label>পাসওয়ার্ড</label>
          <input type="password" id="password" class="form-control" placeholder="পাসওয়ার্ড লিখুন" required>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">লগইন করুন</button>
      </form>

      <div class="auth-footer">
        অ্যাকাউন্ট নেই? <a href="register.html">রেজিস্টার করুন</a>
      </div>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    // Redirect if already logged in
    (async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = 'home.html';
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerText = 'লগইন হচ্ছে...';

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showToast(error.message || 'লগইন ব্যর্থ হয়েছে', 'error');
        btn.disabled = false;
        btn.innerText = 'লগইন করুন';
        return;
      }

      showToast('সফলভাবে লগইন হয়েছে!');
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 800);
    });
  </script>
</body>
</html>
