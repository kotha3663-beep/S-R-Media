<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>রেজিস্টার - NnowQuiz</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo">NnowQuiz</div>
      <p class="auth-subtitle">নতুন অ্যাকাউন্ট তৈরি করুন</p>

      <form id="registerForm">
        <div class="form-group">
          <label>আপনার নাম</label>
          <input type="text" id="fullName" class="form-control" placeholder="পুরো নাম লিখুন" required>
        </div>

        <div class="form-group">
          <label>ইমেইল</label>
          <input type="email" id="email" class="form-control" placeholder="আপনার ইমেইল লিখুন" required>
        </div>

        <div class="form-group">
          <label>পাসওয়ার্ড</label>
          <input type="password" id="password" class="form-control" placeholder="কমপক্ষে ৬ অক্ষর" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" id="registerBtn">রেজিস্টার করুন</button>
      </form>

      <div class="auth-footer">
        ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="login.html">লগইন করুন</a>
      </div>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    // Redirect if already logged in
    (async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = 'home.html';
    })();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (password.length < 6) {
        showToast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'রেজিস্টার হচ্ছে...';

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName
          }
        }
      });

      if (error) {
        showToast(error.message || 'রেজিস্টার ব্যর্থ হয়েছে', 'error');
        btn.disabled = false;
        btn.innerText = 'রেজিস্টার করুন';
        return;
      }

      showToast('অ্যাকাউন্ট তৈরি হয়েছে!');
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 1000);
    });
  </script>
</body>
</html>
