name: Build MyWork APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # বা আপনার পছন্দের স্টেবল ভার্সন
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # Project name ফিক্স + Android ফোল্ডার তৈরি
      - name: Fix Android Project Structure
        run: |
          # pubspec.yaml-এর name ঠিক করা
          sed -i 's/^name:.*/name: mywork/' pubspec.yaml
          
          # flutter create চালানো — project-name আলাদা করে দিচ্ছি
          flutter create . --project-name mywork --org com.mywork --platforms=android

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyWork-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
