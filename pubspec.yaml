name: Build MyWork APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2' 
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Fix Project Name
        run: sed -i 's/^name:.*/name: s_r_media/' pubspec.yaml

      - name: Fix Android Project Structure
        run: flutter create . --platforms=android

      # Gradle এবং Kotlin ভার্সন আপডেট করার স্ক্রিপ্ট
      - name: Upgrade Gradle and Kotlin Version
        run: |
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' android/build.gradle
            sed -i 's/classpath .com.android.tools.build:gradle:.*/classpath "com.android.tools.build:gradle:8.1.0"/' android/build.gradle
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.0-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyWork-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
