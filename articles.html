<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রবন্ধসমূহ - NnowQuiz</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="logo">প্রবন্ধসমূহ</div>
      <div style="width:40px;"></div>
    </div>

    <div id="articlesList">
      <div class="loading">
        <div class="spinner"></div>
        <p>প্রবন্ধ লোড হচ্ছে...</p>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="icon">🏠</span>
      <span>হোম</span>
    </a>
    <a href="articles.html" class="nav-item active">
      <span class="icon">📚</span>
      <span>প্রবন্ধ</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span class="icon">🏆</span>
      <span>র‍্যাঙ্ক</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="icon">👤</span>
      <span>প্রোফাইল</span>
    </a>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    async function loadArticles() {
      const { data: articles, error } = await supabase
        .from('articles')
        .select('*')
        .eq('is_active', true)
        .order('sort_order', { ascending: true });

      const container = document.getElementById('articlesList');

      if (error || !articles || articles.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>এখনো কোনো প্রবন্ধ যোগ করা হয়নি</p>
          </div>
        `;
        return;
      }

      container.innerHTML = articles.map((article, index) => `
        <a href="article.html?id=${article.id}" class="card" style="display:block; transition: transform 0.2s;">
          <div style="display:flex; gap:14px; align-items:flex-start;">
            <div style="width:42px; height:42px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0;">
              ${index + 1}
            </div>
            <div>
              <div class="card-title" style="margin-bottom:4px;">${article.title}</div>
              <p class="text-muted" style="font-size:0.85rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
                ${article.content.substring(0, 100)}...
              </p>
            </div>
          </div>
        </a>
      `).join('');
    }

    loadArticles();
  </script>
</body>
</html>
