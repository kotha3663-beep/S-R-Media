<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রবন্ধ ম্যানেজ - NnowQuiz</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="location.href='index.html'">←</button>
      <div class="logo">প্রবন্ধ ম্যানেজ</div>
      <div style="width:40px;"></div>
    </div>

    <!-- Add New Article -->
    <div class="card">
      <div class="card-title">নতুন প্রবন্ধ যোগ করুন</div>
      <div class="form-group">
        <label>শিরোনাম</label>
        <input type="text" id="title" class="form-control" placeholder="প্রবন্ধের শিরোনাম">
      </div>
      <div class="form-group">
        <label>বিষয়বস্তু</label>
        <textarea id="content" class="form-control" rows="8" placeholder="প্রবন্ধের সম্পূর্ণ লেখা লিখুন..."></textarea>
      </div>
      <div class="form-group">
        <label>ক্রম (Sort Order)</label>
        <input type="number" id="sortOrder" class="form-control" value="0">
      </div>
      <button class="btn btn-primary" onclick="addArticle()">প্রবন্ধ সেভ করুন</button>
    </div>

    <!-- Existing Articles -->
    <div class="card">
      <div class="card-title">বিদ্যমান প্রবন্ধসমূহ</div>
      <div id="articlesList">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    async function init() {
      await requireAdmin();
      loadArticles();
    }

    async function loadArticles() {
      const { data: articles, error } = await supabase
        .from('articles')
        .select('*')
        .order('sort_order', { ascending: true });

      const container = document.getElementById('articlesList');

      if (error || !articles || articles.length === 0) {
        container.innerHTML = `<p class="text-muted text-center">কোনো প্রবন্ধ নেই</p>`;
        return;
      }

      container.innerHTML = articles.map(article => `
        <div style="padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.06);">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
            <div>
              <div style="font-weight:600; margin-bottom:4px;">${article.title}</div>
              <div class="text-muted" style="font-size:0.8rem;">
                ${article.is_active ? '<span style="color:#34d399;">Active</span>' : '<span style="color:#ef4444;">Inactive</span>'} 
                • Order: ${article.sort_order}
              </div>
            </div>
            <div style="display:flex; gap:8px; flex-shrink:0;">
              <button class="btn btn-sm btn-secondary" style="width:auto;" onclick="toggleArticle('${article.id}', ${article.is_active})">
                ${article.is_active ? 'বন্ধ' : 'চালু'}
              </button>
              <button class="btn btn-sm btn-danger" style="width:auto;" onclick="deleteArticle('${article.id}')">ডিলিট</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function addArticle() {
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      const sortOrder = parseInt(document.getElementById('sortOrder').value) || 0;

      if (!title || !content) {
        showToast('শিরোনাম ও বিষয়বস্তু আবশ্যক', 'error');
        return;
      }

      const { error } = await supabase.from('articles').insert({
        title,
        content,
        sort_order: sortOrder,
        is_active: true
      });

      if (error) {
        showToast('সেভ করতে সমস্যা হয়েছে', 'error');
        console.error(error);
        return;
      }

      showToast('প্রবন্ধ সফলভাবে যোগ হয়েছে!');
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      document.getElementById('sortOrder').value = '0';
      loadArticles();
    }

    async function toggleArticle(id, currentStatus) {
      const { error } = await supabase
        .from('articles')
        .update({ is_active: !currentStatus })
        .eq('id', id);

      if (error) {
        showToast('আপডেট ব্যর্থ', 'error');
        return;
      }
      showToast('স্ট্যাটাস পরিবর্তন হয়েছে');
      loadArticles();
    }

    async function deleteArticle(id) {
      if (!confirm('এই প্রবন্ধ ডিলিট করতে চান? এর সব প্রশ্নও ডিলিট হয়ে যাবে।')) return;

      const { error } = await supabase
        .from('articles')
        .delete()
        .eq('id', id);

      if (error) {
        showToast('ডিলিট ব্যর্থ', 'error');
        return;
      }
      showToast('প্রবন্ধ ডিলিট হয়েছে');
      loadArticles();
    }

    init();
  </script>
</body>
</html>
