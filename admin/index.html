<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>এডমিন ড্যাশবোর্ড - NnowQuiz</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <div class="logo">এডমিন প্যানেল</div>
      <button class="btn btn-sm btn-danger" onclick="handleLogout()" style="width:auto;">লগআউট</button>
    </div>

    <div class="card" style="background: linear-gradient(135deg, #312e81, #1e1b4b);">
      <h2 style="font-size:1.2rem;">স্বাগতম এডমিন!</h2>
      <p class="text-muted" style="font-size:0.9rem;">NnowQuiz ম্যানেজমেন্ট প্যানেল</p>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-value" id="totalUsers">-</div>
        <div class="stat-label">মোট ইউজার</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalArticles">-</div>
        <div class="stat-label">প্রবন্ধ</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalQuizzes">-</div>
        <div class="stat-label">কুইজ সাবমিশন</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="quizStatus">-</div>
        <div class="stat-label">কুইজ স্ট্যাটাস</div>
      </div>
    </div>

    <div class="card">
      <a href="articles.html" class="btn btn-primary mb-2">প্রবন্ধ ম্যানেজ করুন</a>
      <a href="questions.html" class="btn btn-secondary mb-2">প্রশ্ন ম্যানেজ করুন</a>
      <a href="settings.html" class="btn btn-secondary mb-2">সেটিংস ও পজ কন্ট্রোল</a>
      <a href="../home.html" class="btn btn-outline">ইউজার সাইটে যান</a>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    async function init() {
      const user = await requireAdmin();
      if (!user) return;

      // Total users
      const { count: userCount } = await supabase
        .from('profiles')
        .select('*', { count: 'exact', head: true });

      // Total articles
      const { count: articleCount } = await supabase
        .from('articles')
        .select('*', { count: 'exact', head: true });

      // Total quiz submissions
      const { count: quizCount } = await supabase
        .from('quiz_submissions')
        .select('*', { count: 'exact', head: true });

      // Quiz pause status
      const { data: pauseSetting } = await supabase
        .from('app_settings')
        .select('value')
        .eq('key', 'quiz_paused')
        .maybeSingle();

      document.getElementById('totalUsers').innerText = userCount || 0;
      document.getElementById('totalArticles').innerText = articleCount || 0;
      document.getElementById('totalQuizzes').innerText = quizCount || 0;
      document.getElementById('quizStatus').innerText = (pauseSetting && pauseSetting.value === 'true') ? 'বন্ধ' : 'চালু';
      document.getElementById('quizStatus').style.color = (pauseSetting && pauseSetting.value === 'true') ? '#ef4444' : '#34d399';
    }

    async function handleLogout() {
      if (confirm('লগআউট করতে চান?')) {
        await signOut();
      }
    }

    init();
  </script>
</body>
</html>
