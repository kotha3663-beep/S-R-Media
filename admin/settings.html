<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>সেটিংস - NnowQuiz</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="location.href='index.html'">←</button>
      <div class="logo">সেটিংস</div>
      <div style="width:40px;"></div>
    </div>

    <!-- Quiz Pause Control -->
    <div class="card">
      <div class="card-title">কুইজ পজ কন্ট্রোল</div>
      <p class="text-muted mb-3" style="font-size:0.9rem;">
        কুইজ পজ করলে ইউজাররা আর নতুন কুইজ দিতে পারবে না। লিডারবোর্ড ও প্রবন্ধ দেখা যাবে।
      </p>
      <div id="pauseStatus" class="mb-3" style="font-size:1.1rem; font-weight:600;"></div>
      <button class="btn btn-danger" id="pauseBtn" onclick="togglePause()">কুইজ পজ করুন</button>
    </div>

    <!-- Other Settings -->
    <div class="card">
      <div class="card-title">অন্যান্য সেটিংস</div>

      <div class="form-group">
        <label>প্রতি সেশনে সর্বোচ্চ কুইজ (বর্তমানে ৮)</label>
        <input type="number" id="maxQuizzes" class="form-control" value="8">
      </div>

      <div class="form-group">
        <label>সেশন লক সময় (ঘণ্টা)</label>
        <input type="number" id="sessionHours" class="form-control" value="2">
      </div>

      <div class="form-group">
        <label>প্রতি সঠিক উত্তরে পয়েন্ট</label>
        <input type="number" id="coinsPerCorrect" class="form-control" value="10">
      </div>

      <button class="btn btn-primary" onclick="saveSettings()">সেটিংস সেভ করুন</button>
    </div>

    <!-- Make Admin -->
    <div class="card">
      <div class="card-title">অ্যাডমিন বানান</div>
      <p class="text-muted mb-3" style="font-size:0.85rem;">কোনো ইউজারের ইমেইল দিয়ে তাকে অ্যাডমিন বানাতে পারবেন</p>
      <div class="form-group">
        <input type="email" id="adminEmail" class="form-control" placeholder="ইউজারের ইমেইল">
      </div>
      <button class="btn btn-secondary" onclick="makeAdmin()">অ্যাডমিন বানান</button>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    let isPaused = false;

    async function init() {
      await requireAdmin();
      await loadPauseStatus();
      await loadSettings();
    }

    async function loadPauseStatus() {
      const { data } = await supabase
        .from('app_settings')
        .select('value')
        .eq('key', 'quiz_paused')
        .maybeSingle();

      isPaused = data && data.value === 'true';
      updatePauseUI();
    }

    function updatePauseUI() {
      const statusEl = document.getElementById('pauseStatus');
      const btn = document.getElementById('pauseBtn');

      if (isPaused) {
        statusEl.innerHTML = 'বর্তমান স্ট্যাটাস: <span style="color:#ef4444;">বন্ধ আছে</span>';
        btn.innerText = 'কুইজ চালু করুন';
        btn.className = 'btn btn-success';
      } else {
        statusEl.innerHTML = 'বর্তমান স্ট্যাটাস: <span style="color:#34d399;">চালু আছে</span>';
        btn.innerText = 'কুইজ পজ করুন';
        btn.className = 'btn btn-danger';
      }
    }

    async function togglePause() {
      const newValue = isPaused ? 'false' : 'true';

      const { data: existing } = await supabase
        .from('app_settings')
        .select('key')
        .eq('key', 'quiz_paused')
        .maybeSingle();

      if (existing) {
        await supabase
          .from('app_settings')
          .update({ value: newValue, updated_at: new Date().toISOString() })
          .eq('key', 'quiz_paused');
      } else {
        await supabase
          .from('app_settings')
          .insert({ key: 'quiz_paused', value: newValue });
      }

      isPaused = !isPaused;
      updatePauseUI();
      showToast(isPaused ? 'কুইজ পজ করা হয়েছে' : 'কুইজ চালু করা হয়েছে');
    }

    async function loadSettings() {
      const { data } = await supabase.from('app_settings').select('*');
      if (!data) return;

      data.forEach(item => {
        if (item.key === 'max_quizzes_per_session') document.getElementById('maxQuizzes').value = item.value;
        if (item.key === 'session_lock_hours') document.getElementById('sessionHours').value = item.value;
        if (item.key === 'coins_per_correct') document.getElementById('coinsPerCorrect').value = item.value;
      });
    }

    async function saveSettings() {
      const settings = [
        { key: 'max_quizzes_per_session', value: document.getElementById('maxQuizzes').value },
        { key: 'session_lock_hours', value: document.getElementById('sessionHours').value },
        { key: 'coins_per_correct', value: document.getElementById('coinsPerCorrect').value }
      ];

      for (const setting of settings) {
        const { data: existing } = await supabase
          .from('app_settings')
          .select('key')
          .eq('key', setting.key)
          .maybeSingle();

        if (existing) {
          await supabase
            .from('app_settings')
            .update({ value: setting.value, updated_at: new Date().toISOString() })
            .eq('key', setting.key);
        } else {
          await supabase.from('app_settings').insert(setting);
        }
      }

      showToast('সেটিংস সেভ হয়েছে!');
    }

    async function makeAdmin() {
      const email = document.getElementById('adminEmail').value.trim();
      if (!email) {
        showToast('ইমেইল লিখুন', 'error');
        return;
      }

      // Find user by email from auth is not directly possible with anon key easily.
      // Alternative: Update by matching profile (we need user id).
      // For simplicity we show instruction.
      showToast('Supabase Dashboard → Authentication → Users থেকে ইউজারের UUID কপি করে profiles টেবিলে is_admin = true করুন', 'warning');
    }

    init();
  </script>
</body>
</html>
