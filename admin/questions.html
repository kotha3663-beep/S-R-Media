<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রশ্ন ম্যানেজ - NnowQuiz</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="location.href='index.html'">←</button>
      <div class="logo">প্রশ্ন ম্যানেজ</div>
      <div style="width:40px;"></div>
    </div>

    <!-- Add Question -->
    <div class="card">
      <div class="card-title">নতুন প্রশ্ন যোগ করুন</div>

      <div class="form-group">
        <label>প্রবন্ধ সিলেক্ট করুন</label>
        <select id="articleId" class="form-control"></select>
      </div>

      <div class="form-group">
        <label>সেট নম্বর (১, ২ বা ৩)</label>
        <select id="setNumber" class="form-control">
          <option value="1">সেট ১</option>
          <option value="2">সেট ২</option>
          <option value="3">সেট ৩</option>
        </select>
      </div>

      <div class="form-group">
        <label>প্রশ্ন</label>
        <textarea id="questionText" class="form-control" rows="3" placeholder="প্রশ্ন লিখুন..."></textarea>
      </div>

      <div class="form-group">
        <label>অপশন A</label>
        <input type="text" id="optionA" class="form-control" placeholder="অপশন A">
      </div>
      <div class="form-group">
        <label>অপশন B</label>
        <input type="text" id="optionB" class="form-control" placeholder="অপশন B">
      </div>
      <div class="form-group">
        <label>অপশন C</label>
        <input type="text" id="optionC" class="form-control" placeholder="অপশন C">
      </div>
      <div class="form-group">
        <label>অপশন D</label>
        <input type="text" id="optionD" class="form-control" placeholder="অপশন D">
      </div>

      <div class="form-group">
        <label>সঠিক উত্তর</label>
        <select id="correctOption" class="form-control">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="addQuestion()">প্রশ্ন সেভ করুন</button>
    </div>

    <!-- Filter & List -->
    <div class="card">
      <div class="card-title">বিদ্যমান প্রশ্নসমূহ</div>
      <div class="form-group">
        <select id="filterArticle" class="form-control" onchange="loadQuestions()">
          <option value="">সব প্রবন্ধ</option>
        </select>
      </div>
      <div id="questionsList">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    let articles = [];

    async function init() {
      await requireAdmin();
      await loadArticlesDropdown();
      loadQuestions();
    }

    async function loadArticlesDropdown() {
      const { data } = await supabase
        .from('articles')
        .select('id, title')
        .order('sort_order', { ascending: true });

      articles = data || [];

      const options = articles.map(a => `<option value="\( {a.id}"> \){a.title}</option>`).join('');
      document.getElementById('articleId').innerHTML = options || '<option value="">কোনো প্রবন্ধ নেই</option>';
      document.getElementById('filterArticle').innerHTML = `<option value="">সব প্রবন্ধ</option>` + options;
    }

    async function loadQuestions() {
      const filterId = document.getElementById('filterArticle').value;
      let query = supabase.from('questions').select('*, articles(title)').order('created_at', { ascending: false });

      if (filterId) {
        query = query.eq('article_id', filterId);
      }

      const { data: questions, error } = await query.limit(50);
      const container = document.getElementById('questionsList');

      if (error || !questions || questions.length === 0) {
        container.innerHTML = `<p class="text-muted text-center">কোনো প্রশ্ন নেই</p>`;
        return;
      }

      container.innerHTML = questions.map(q => `
        <div style="padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.06);">
          <div style="font-weight:600; margin-bottom:6px; font-size:0.95rem;">${q.question_text}</div>
          <div class="text-muted" style="font-size:0.8rem; margin-bottom:8px;">
            ${q.articles?.title || 'Unknown'} • সেট ${q.set_number} • সঠিক: ${q.correct_option}
          </div>
          <button class="btn btn-sm btn-danger" style="width:auto;" onclick="deleteQuestion('${q.id}')">ডিলিট</button>
        </div>
      `).join('');
    }

    async function addQuestion() {
      const article_id = document.getElementById('articleId').value;
      const set_number = parseInt(document.getElementById('setNumber').value);
      const question_text = document.getElementById('questionText').value.trim();
      const option_a = document.getElementById('optionA').value.trim();
      const option_b = document.getElementById('optionB').value.trim();
      const option_c = document.getElementById('optionC').value.trim();
      const option_d = document.getElementById('optionD').value.trim();
      const correct_option = document.getElementById('correctOption').value;

      if (!article_id || !question_text || !option_a || !option_b || !option_c || !option_d) {
        showToast('সব ঘর পূরণ করুন', 'error');
        return;
      }

      const { error } = await supabase.from('questions').insert({
        article_id,
        set_number,
        question_text,
        option_a,
        option_b,
        option_c,
        option_d,
        correct_option
      });

      if (error) {
        showToast('সেভ করতে সমস্যা', 'error');
        console.error(error);
        return;
      }

      showToast('প্রশ্ন সফলভাবে যোগ হয়েছে!');
      document.getElementById('questionText').value = '';
      document.getElementById('optionA').value = '';
      document.getElementById('optionB').value = '';
      document.getElementById('optionC').value = '';
      document.getElementById('optionD').value = '';
      loadQuestions();
    }

    async function deleteQuestion(id) {
      if (!confirm('এই প্রশ্ন ডিলিট করতে চান?')) return;

      const { error } = await supabase.from('questions').delete().eq('id', id);
      if (error) {
        showToast('ডিলিট ব্যর্থ', 'error');
        return;
      }
      showToast('প্রশ্ন ডিলিট হয়েছে');
      loadQuestions();
    }

    init();
  </script>
</body>
</html>
